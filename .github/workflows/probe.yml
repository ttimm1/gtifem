name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check gtifem.ru
        run: |
          set -x
          curl -sS -m 25 -o /dev/null -w "GET %{http_code} %{size_download}\n" https://gtifem.ru/dekanat/raspisanie/ || true
          curl -sS -m 25 -o /tmp/g.json -w "POST %{http_code} %{size_download}\n" \
            -X POST https://gtifem.ru/dekanat/raspisanie/ \
            -H "X-Requested-With: XMLHttpRequest" \
            -H "Referer: https://gtifem.ru/dekanat/raspisanie/" \
            -A "Mozilla/5.0" \
            --data-urlencode "special=Экономика" --data-urlencode "course=1" || true
          cat /tmp/g.json || true
